<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="레이어 캐시 전략 개념도">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .laneTitle { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
      .good { fill: #ecfdf5; stroke: #059669; }
      .bad { fill: #fef2f2; stroke: #dc2626; }
      .neutral { fill: #eff6ff; stroke: #2563eb; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .muted { fill: #475569; font: 600 16px Arial, sans-serif; }
      .step { font: 700 16px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="600"/>

  <text class="title" x="60" y="70">Dockerfile 레이어 캐시 전략(개념도)</text>
  <text class="small" x="60" y="100">변경이 잦은 파일을 앞에 두면 캐시가 자주 깨져 빌드가 느려집니다. 의존성 단계와 소스 단계의 순서를 분리하세요.</text>

  <!-- Lanes -->
  <text class="laneTitle" x="60" y="160">좋은 예(캐시 친화)</text>
  <text class="laneTitle" x="640" y="160">나쁜 예(캐시 비친화)</text>

  <!-- Good lane boxes -->
  <rect class="box neutral" x="60" y="190" width="520" height="70"/>
  <text class="step" x="90" y="235">1) COPY 의존성 정의 파일</text>
  <text class="small" x="320" y="235">예: package-lock.json, requirements.txt</text>

  <rect class="box good" x="60" y="280" width="520" height="70"/>
  <text class="step" x="90" y="325">2) RUN 의존성 설치</text>
  <text class="small" x="320" y="325">변경이 적어 캐시가 잘 유지됨</text>

  <rect class="box neutral" x="60" y="370" width="520" height="70"/>
  <text class="step" x="90" y="415">3) COPY 애플리케이션 소스</text>
  <text class="small" x="320" y="415">변경이 잦아도 상위 레이어만 재빌드</text>

  <rect class="box good" x="60" y="460" width="520" height="70"/>
  <text class="step" x="90" y="505">4) RUN 빌드/테스트(선택)</text>
  <text class="small" x="320" y="505">필요 시 멀티스테이지로 분리</text>

  <!-- Bad lane boxes -->
  <rect class="box bad" x="640" y="190" width="500" height="70"/>
  <text class="step" x="670" y="235">1) COPY 전체 소스 먼저</text>
  <text class="small" x="930" y="235">작은 수정에도 캐시가 깨짐</text>

  <rect class="box bad" x="640" y="280" width="500" height="70"/>
  <text class="step" x="670" y="325">2) RUN 의존성 설치</text>
  <text class="small" x="930" y="325">매번 다시 수행되어 느림</text>

  <rect class="box neutral" x="640" y="370" width="500" height="70"/>
  <text class="step" x="670" y="415">3) RUN 빌드</text>
  <text class="small" x="930" y="415">전체 재빌드로 이어짐</text>

  <!-- Arrows -->
  <path class="arrow" d="M 320 260 L 320 280"/>
  <path class="arrow" d="M 320 350 L 320 370"/>
  <path class="arrow" d="M 320 440 L 320 460"/>

  <path class="arrow" d="M 890 260 L 890 280"/>
  <path class="arrow" d="M 890 350 L 890 370"/>

  <!-- Notes -->
  <text class="muted" x="60" y="565">팁: .dockerignore로 컨텍스트를 줄이면 "전송" 자체가 빨라지고, 캐시 활용도도 좋아집니다.</text>
</svg>

