<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="DevOps 피드백 루프(Plan-Code-Build-Test-Release-Deploy-Operate-Monitor)">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .node { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; }
      .node2 { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text class="title" x="60" y="70">DevOps 피드백 루프(개념도)</text>
  <text class="small" x="60" y="100">핵심은 "한 번에 크게"가 아니라 "작게 자주" 그리고 모니터링 결과를 다시 Plan으로 되돌리는 반복입니다.</text>

  <!-- Nodes (top row) -->
  <rect class="node2" x="120" y="160" width="220" height="70"/>
  <text class="label" x="190" y="205">Plan</text>

  <rect class="node" x="380" y="160" width="220" height="70"/>
  <text class="label" x="460" y="205">Code</text>

  <rect class="node" x="640" y="160" width="220" height="70"/>
  <text class="label" x="710" y="205">Build</text>

  <rect class="node" x="900" y="160" width="220" height="70"/>
  <text class="label" x="980" y="205">Test</text>

  <!-- Nodes (bottom row) -->
  <rect class="node" x="900" y="320" width="220" height="70"/>
  <text class="label" x="970" y="365">Release</text>

  <rect class="node" x="640" y="320" width="220" height="70"/>
  <text class="label" x="720" y="365">Deploy</text>

  <rect class="node" x="380" y="320" width="220" height="70"/>
  <text class="label" x="440" y="365">Operate</text>

  <rect class="node2" x="120" y="320" width="220" height="70"/>
  <text class="label" x="185" y="365">Monitor</text>

  <!-- Arrows top row -->
  <path class="arrow" d="M 340 195 L 380 195"/>
  <path class="arrow" d="M 600 195 L 640 195"/>
  <path class="arrow" d="M 860 195 L 900 195"/>

  <!-- Arrows right turn -->
  <path class="arrow" d="M 1010 230 C 1090 260, 1090 290, 1010 320"/>

  <!-- Arrows bottom row (right-to-left) -->
  <path class="arrow" d="M 900 355 L 860 355"/>
  <path class="arrow" d="M 640 355 L 600 355"/>
  <path class="arrow" d="M 380 355 L 340 355"/>

  <!-- Back to Plan -->
  <path class="arrow" d="M 120 355 C 40 320, 40 240, 120 195"/>

  <text class="small" x="60" y="540">실무 포인트: Monitor가 있어야 개선이 "감"이 아니라 "데이터" 기반이 됩니다(DORA 지표 등).</text>
</svg>

