<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="이미지와 컨테이너 비교(템플릿 vs 실행 인스턴스)">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; }
      .accent { fill: #eff6ff; stroke: #2563eb; }
      .accent2 { fill: #ecfeff; stroke: #0e7490; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .desc { font: 600 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="560"/>
  <text class="title" x="60" y="70">Image vs Container</text>
  <text class="small" x="60" y="100">이미지는 "불변 템플릿", 컨테이너는 "실행 인스턴스(상태/프로세스/네트워크/쓰기 레이어 포함)"</text>

  <rect class="box accent" x="120" y="170" width="420" height="250"/>
  <text class="label" x="160" y="220">Image</text>
  <text class="desc" x="160" y="255">- 레이어 기반 파일시스템</text>
  <text class="desc" x="160" y="285">- 메타데이터(CMD/ENV/EXPOSE)</text>
  <text class="desc" x="160" y="315">- name:tag (가변) / digest(불변)</text>
  <text class="desc" x="160" y="345">- 배포 아티팩트</text>

  <rect class="box accent2" x="660" y="170" width="420" height="250"/>
  <text class="label" x="700" y="220">Container</text>
  <text class="desc" x="700" y="255">- 이미지에서 생성(run)</text>
  <text class="desc" x="700" y="285">- PID 1 프로세스가 종료되면 종료</text>
  <text class="desc" x="700" y="315">- 네트워크/볼륨/쓰기 레이어</text>
  <text class="desc" x="700" y="345">- 상태(exited/running 등)</text>

  <path class="arrow" d="M 540 295 L 660 295"/>
  <text class="small" x="520" y="470">docker run = 이미지 템플릿 -> 실행 인스턴스 생성</text>
</svg>

