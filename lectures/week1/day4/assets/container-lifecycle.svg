<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Docker 컨테이너 수명주기 상태도">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .state { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; }
      .active { fill: #ecfeff; stroke: #0e7490; }
      .end { fill: #fef2f2; stroke: #dc2626; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .cmd { font: 600 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="600"/>
  <text class="title" x="60" y="70">Docker 컨테이너 수명주기(상태 전이)</text>
  <text class="small" x="60" y="100">운영에서 자주 쓰는 명령(run/start/stop/rm/restart/pause)을 상태 전이로 기억하면 훨씬 빠르게 대응할 수 있습니다.</text>

  <!-- States -->
  <rect class="state" x="120" y="180" width="240" height="90"/>
  <text class="label" x="160" y="225">created</text>
  <text class="cmd" x="160" y="252">docker create</text>

  <rect class="state active" x="480" y="180" width="240" height="90"/>
  <text class="label" x="520" y="225">running</text>
  <text class="cmd" x="520" y="252">docker start</text>

  <rect class="state" x="480" y="330" width="240" height="90"/>
  <text class="label" x="520" y="375">paused</text>
  <text class="cmd" x="520" y="402">docker pause</text>

  <rect class="state end" x="840" y="180" width="240" height="90"/>
  <text class="label" x="880" y="225">exited</text>
  <text class="cmd" x="880" y="252">docker stop / exit</text>

  <rect class="state" x="840" y="330" width="240" height="90"/>
  <text class="label" x="880" y="375">removed</text>
  <text class="cmd" x="880" y="402">docker rm</text>

  <!-- Arrows -->
  <path class="arrow" d="M 360 225 L 480 225"/>
  <path class="arrow" d="M 720 225 L 840 225"/>
  <path class="arrow" d="M 600 270 L 600 330"/>
  <path class="arrow" d="M 720 375 L 840 375"/>

  <!-- Back transitions -->
  <path class="arrow" d="M 840 210 C 780 210, 780 210, 720 210"/>
  <text class="cmd" x="735" y="195">docker restart</text>

  <path class="arrow" d="M 600 420 L 600 270"/>
  <text class="cmd" x="620" y="305">docker unpause</text>

  <text class="small" x="120" y="520">포인트: 컨테이너는 PID 1이 종료되면 exited로 이동합니다. exited 상태는 "삭제됨"이 아니라 "멈춰있음"입니다.</text>
</svg>

