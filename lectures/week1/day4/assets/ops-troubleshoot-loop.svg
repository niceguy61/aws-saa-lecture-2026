<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="컨테이너 트러블슈팅 루프">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .node { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; }
      .accent { fill: #eff6ff; stroke: #2563eb; }
      .accent2 { fill: #ecfdf5; stroke: #059669; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .cmd { font: 600 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="600"/>
  <text class="title" x="60" y="70">컨테이너 트러블슈팅 기본 루프</text>
  <text class="small" x="60" y="100">운영에서 빠른 진단은 "상태 -> 로그 -> 설정 -> 내부 확인" 순서로 반복합니다.</text>

  <rect class="node accent" x="120" y="170" width="260" height="110"/>
  <text class="label" x="150" y="215">1) 상태 확인</text>
  <text class="cmd" x="150" y="245">docker ps -a</text>
  <text class="cmd" x="150" y="270">ExitCode/RestartCount</text>

  <rect class="node accent" x="470" y="170" width="260" height="110"/>
  <text class="label" x="500" y="215">2) 로그 확인</text>
  <text class="cmd" x="500" y="245">docker logs</text>
  <text class="cmd" x="500" y="270">반복되는 첫 에러</text>

  <rect class="node accent" x="820" y="170" width="260" height="110"/>
  <text class="label" x="850" y="215">3) 설정 확인</text>
  <text class="cmd" x="850" y="245">docker inspect</text>
  <text class="cmd" x="850" y="270">Env/Ports/Mounts</text>

  <rect class="node accent2" x="470" y="350" width="260" height="110"/>
  <text class="label" x="500" y="395">4) 내부 확인(필요시)</text>
  <text class="cmd" x="500" y="425">docker exec</text>
  <text class="cmd" x="500" y="450">ps, 파일, 네트워크</text>

  <!-- Arrows -->
  <path class="arrow" d="M 380 225 L 470 225"/>
  <path class="arrow" d="M 730 225 L 820 225"/>
  <path class="arrow" d="M 950 280 C 950 340, 760 380, 730 405"/>
  <path class="arrow" d="M 470 405 C 410 370, 240 340, 240 280"/>

  <text class="small" x="120" y="540">팁: 재시작 루프가 심하면 restart 정책을 잠깐 제거하고 단독 실행으로 원인을 먼저 잡습니다.</text>
</svg>

