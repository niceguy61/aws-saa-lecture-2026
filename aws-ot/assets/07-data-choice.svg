<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #fdf2f8; stroke: #9d174d; stroke-width: 2; }
      .box2 { fill: #ffffff; stroke: #9d174d; stroke-width: 2; }
      .h { font: 700 22px sans-serif; fill: #831843; }
      .t { font: 16px sans-serif; fill: #831843; }
      .s { font: 13px sans-serif; fill: #9d174d; }
      .line { stroke: #9d174d; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="520"/>
  <text class="h" x="40" y="45">Data Choice (RDS/Aurora vs DynamoDB)</text>

  <rect class="box" x="40" y="80" width="920" height="360" rx="16"/>

  <rect class="box2" x="90" y="150" width="380" height="260" rx="12"/>
  <text class="t" x="115" y="190">Relational</text>
  <text class="s" x="115" y="215">joins, SQL, transactions</text>
  <text class="t" x="115" y="255">RDS or Aurora</text>
  <text class="s" x="115" y="285">HA: Multi-AZ</text>
  <text class="s" x="115" y="310">Read scaling: Read replica</text>

  <rect class="box2" x="530" y="150" width="380" height="260" rx="12"/>
  <text class="t" x="555" y="190">NoSQL</text>
  <text class="s" x="555" y="215">key based, low latency, elastic</text>
  <text class="t" x="555" y="255">DynamoDB</text>
  <text class="s" x="555" y="285">Design by access patterns</text>
  <text class="s" x="555" y="310">Avoid Scan for large tables</text>

  <line class="line" x1="500" y1="150" x2="500" y2="410"/>
</svg>

