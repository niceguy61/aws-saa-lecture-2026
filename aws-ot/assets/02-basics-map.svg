<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f0fdf4; stroke: #064e3b; stroke-width: 2; }
      .sub { fill: #ffffff; stroke: #064e3b; stroke-width: 2; }
      .h { font: 700 22px sans-serif; fill: #052e16; }
      .t { font: 16px sans-serif; fill: #052e16; }
      .s { font: 13px sans-serif; fill: #065f46; }
      .line { stroke: #065f46; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="520"/>
  <text class="h" x="40" y="45">AWS 기본 지도 (VPC, EC2, S3, IAM)</text>

  <rect class="box" x="40" y="80" width="920" height="360" rx="16"/>
  <text class="t" x="60" y="120">VPC (네트워크 경계)</text>

  <rect class="sub" x="70" y="150" width="400" height="260" rx="14"/>
  <text class="t" x="90" y="185">퍼블릭 서브넷</text>
  <rect class="sub" x="100" y="210" width="150" height="70" rx="10"/>
  <text class="t" x="118" y="255">ALB</text>

  <rect class="sub" x="500" y="150" width="430" height="260" rx="14"/>
  <text class="t" x="520" y="185">프라이빗 서브넷</text>
  <rect class="sub" x="530" y="210" width="170" height="70" rx="10"/>
  <text class="t" x="548" y="255">EC2 앱</text>
  <rect class="sub" x="720" y="210" width="170" height="70" rx="10"/>
  <text class="t" x="742" y="255">DB</text>

  <line class="line" x1="250" y1="245" x2="530" y2="245"/>
  <line class="line" x1="700" y1="245" x2="720" y2="245"/>

  <text class="t" x="60" y="470">IAM role: 장기 키 공유 없이 EC2에 권한을 준다.</text>
  <text class="s" x="60" y="495">S3 접근은 보안 그룹이 아니라 정책으로 제어한다.</text>
</svg>
