<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f7f7f9; stroke: #1f2937; stroke-width: 2; }
      .box2 { fill: #eef2ff; stroke: #1f2937; stroke-width: 2; }
      .h { font: 700 22px sans-serif; fill: #111827; }
      .t { font: 16px sans-serif; fill: #111827; }
      .s { font: 13px sans-serif; fill: #374151; }
      .lbl { font: 700 16px sans-serif; fill: #111827; }
      .line { stroke: #111827; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="520"/>

  <text class="h" x="40" y="45">Shared Responsibility (Why AWS is not only infra)</text>

  <rect class="box" x="40" y="80" width="440" height="380" rx="14"/>
  <rect class="box2" x="520" y="80" width="440" height="380" rx="14"/>

  <text class="lbl" x="60" y="115">Customer responsibility</text>
  <text class="lbl" x="540" y="115">AWS responsibility</text>

  <text class="t" x="60" y="155">- Identity and access (IAM)</text>
  <text class="t" x="60" y="185">- Data classification and encryption choices</text>
  <text class="t" x="60" y="215">- Network and service configuration</text>
  <text class="t" x="60" y="245">- App code, dependencies, secrets</text>
  <text class="t" x="60" y="275">- Monitoring, response, cost guardrails</text>

  <text class="t" x="540" y="155">- Physical data centers</text>
  <text class="t" x="540" y="185">- Hardware and virtualization layer</text>
  <text class="t" x="540" y="215">- Core managed services availability</text>
  <text class="t" x="540" y="245">- Global infrastructure operations</text>

  <line class="line" x1="500" y1="80" x2="500" y2="460"/>

  <text class="s" x="40" y="500">Key point: Most incidents are configuration/permission mistakes, not hardware failures.</text>
</svg>

