<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2; }
      .box2 { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .h { font: 700 22px sans-serif; fill: #0f172a; }
      .t { font: 16px sans-serif; fill: #0f172a; }
      .s { font: 13px sans-serif; fill: #334155; }
      .line { stroke: #0f172a; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="520"/>
  <text class="h" x="40" y="45">Reference Architecture (Workshop starting point)</text>

  <rect class="box" x="40" y="80" width="920" height="360" rx="16"/>

  <rect class="box2" x="90" y="150" width="170" height="80" rx="12"/>
  <text class="t" x="120" y="195">Route 53</text>
  <rect class="box2" x="280" y="150" width="170" height="80" rx="12"/>
  <text class="t" x="315" y="195">CloudFront</text>
  <rect class="box2" x="470" y="150" width="170" height="80" rx="12"/>
  <text class="t" x="525" y="195">ALB</text>
  <rect class="box2" x="660" y="150" width="170" height="80" rx="12"/>
  <text class="t" x="700" y="195">App</text>

  <line class="line" x1="260" y1="190" x2="280" y2="190"/>
  <line class="line" x1="450" y1="190" x2="470" y2="190"/>
  <line class="line" x1="640" y1="190" x2="660" y2="190"/>

  <rect class="box2" x="520" y="280" width="180" height="80" rx="12"/>
  <text class="t" x="580" y="325">DB</text>
  <rect class="box2" x="730" y="280" width="180" height="80" rx="12"/>
  <text class="t" x="780" y="325">Queue</text>

  <line class="line" x1="745" y1="230" x2="610" y2="280"/>
  <line class="line" x1="745" y1="230" x2="820" y2="280"/>

  <text class="s" x="90" y="415">Use this to explain tradeoffs: cache, scaling, failure domains, and cost drivers.</text>
</svg>

