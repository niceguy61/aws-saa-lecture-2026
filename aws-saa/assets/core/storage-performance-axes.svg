<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-label="Storage performance axes: latency, IOPS, throughput and service fit">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="380" rx="18"/>
  <text class="title" x="28" y="42">Storage performance: match the axis (IOPS vs throughput vs sharing)</text>

  <rect class="box" x="60" y="90" width="420" height="250" rx="14"/>
  <text class="text" x="80" y="124">Axes</text>
  <rect class="muted" x="90" y="145" width="370" height="44" rx="10"/>
  <text class="text" x="110" y="173">Latency (ms)</text>
  <rect class="muted" x="90" y="200" width="370" height="44" rx="10"/>
  <text class="text" x="110" y="228">IOPS (random small IO)</text>
  <rect class="muted" x="90" y="255" width="370" height="44" rx="10"/>
  <text class="text" x="110" y="283">Throughput (MB/s) + sharing</text>

  <rect class="box" x="520" y="90" width="400" height="250" rx="14"/>
  <text class="text" x="540" y="124">Typical fit (exam patterns)</text>

  <rect class="muted" x="550" y="145" width="340" height="46" rx="10"/>
  <text class="text" x="566" y="174">EBS gp3: balanced, tune IOPS/throughput</text>

  <rect class="muted" x="550" y="200" width="340" height="46" rx="10"/>
  <text class="text" x="566" y="229">EBS io1/io2: high, consistent IOPS</text>

  <rect class="muted" x="550" y="255" width="340" height="46" rx="10"/>
  <text class="text" x="566" y="284">EFS: shared POSIX filesystem (many instances)</text>

  <text class="small" x="28" y="360">Exam intuition: "shared filesystem" => EFS. "random IOPS bottleneck" => io2/io1. "need tune without resizing" => gp3.</text>
</svg>

