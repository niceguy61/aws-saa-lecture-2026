<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="VPC endpoints: gateway vs interface (PrivateLink)">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .vpc { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .subnet { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #e5e7eb; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#m); }
      .dash { stroke-dasharray: 6 6; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="420" rx="18"/>
  <text class="title" x="28" y="42">VPC Endpoints: Gateway vs Interface (PrivateLink)</text>

  <!-- VPC -->
  <rect class="vpc" x="28" y="70" width="660" height="320" rx="16"/>
  <text class="text" x="48" y="98">VPC</text>

  <!-- Private subnet -->
  <rect class="subnet" x="48" y="120" width="300" height="240" rx="14"/>
  <text class="text" x="68" y="148">Private subnet</text>
  <rect class="box" x="78" y="175" width="250" height="70" rx="12"/>
  <text class="text" x="98" y="215">Workload (EC2/ECS/Lambda)</text>

  <!-- Interface endpoint -->
  <rect class="muted" x="78" y="265" width="250" height="70" rx="12"/>
  <text class="text" x="98" y="296">Interface endpoint (ENI)</text>
  <text class="small" x="98" y="318">Has security group</text>

  <!-- Route table + gateway endpoint -->
  <rect class="box" x="380" y="150" width="280" height="110" rx="14"/>
  <text class="text" x="400" y="182">Route table</text>
  <text class="small" x="400" y="206">+ Gateway endpoint routes</text>
  <text class="small" x="400" y="228">S3, DynamoDB only</text>

  <!-- NAT path (not recommended) -->
  <rect class="box" x="380" y="285" width="280" height="80" rx="14"/>
  <text class="text" x="400" y="318">NAT Gateway path</text>
  <text class="small" x="400" y="340">Internet egress + cost</text>

  <!-- AWS services (outside VPC) -->
  <rect class="muted" x="720" y="130" width="230" height="90" rx="14"/>
  <text class="text" x="740" y="165">S3 / DynamoDB</text>
  <text class="small" x="740" y="188">Gateway endpoint</text>

  <rect class="muted" x="720" y="255" width="230" height="90" rx="14"/>
  <text class="text" x="740" y="290">Other AWS services</text>
  <text class="small" x="740" y="313">Interface endpoint</text>

  <!-- Arrows -->
  <path class="arrow" d="M 328 210 L 380 210"/>
  <text class="small" x="334" y="198">to S3/DDB</text>
  <path class="arrow" d="M 660 200 L 720 175"/>

  <path class="arrow" d="M 328 300 L 720 300"/>
  <text class="small" x="350" y="292">PrivateLink</text>

  <path class="arrow dash" d="M 328 235 L 380 318"/>
  <path class="arrow dash" d="M 660 318 L 720 318"/>
  <text class="small" x="408" y="278">avoid if endpoint fits</text>

  <text class="small" x="28" y="406">Exam intuition: "private access, reduce NAT cost, avoid internet path" strongly hints VPC endpoints. S3/DynamoDB are gateway; most others are interface.</text>
</svg>

