<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Compute purchase options decision: On-Demand vs Savings Plans/RI vs Spot">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="360" rx="18"/>
  <text class="title" x="28" y="42">Purchase options: match predictability and interruption tolerance</text>

  <rect class="box" x="60" y="90" width="260" height="220" rx="14"/>
  <text class="text" x="80" y="126">Workload signals</text>
  <text class="small" x="80" y="156">steady state 1-3y?</text>
  <text class="small" x="80" y="178">can be interrupted?</text>
  <text class="small" x="80" y="200">spiky/unpredictable?</text>

  <rect class="muted" x="380" y="95" width="220" height="90" rx="14"/>
  <text class="text" x="400" y="132">Savings Plans / RI</text>
  <text class="small" x="400" y="156">predictable usage</text>

  <rect class="muted" x="380" y="220" width="220" height="90" rx="14"/>
  <text class="text" x="400" y="257">On-Demand</text>
  <text class="small" x="400" y="281">flexible, baseline</text>

  <rect class="muted" x="660" y="155" width="240" height="90" rx="14"/>
  <text class="text" x="680" y="192">Spot</text>
  <text class="small" x="680" y="216">interruptible, big discount</text>

  <path class="arrow" d="M 320 140 L 380 140"/>
  <text class="small" x="330" y="130">steady</text>
  <path class="arrow" d="M 320 250 L 380 250"/>
  <text class="small" x="330" y="240">spiky</text>
  <path class="arrow" d="M 600 250 C 640 240, 650 230, 660 220"/>
  <text class="small" x="608" y="232">interruptible</text>

  <text class="small" x="28" y="340">Exam intuition: "steady and predictable" => SP/RI. "batch / fault-tolerant / can be interrupted" => Spot. Otherwise On-Demand + scaling.</text>
</svg>

