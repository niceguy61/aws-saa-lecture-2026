<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #fefce8; stroke: #a16207; stroke-width: 2; }
      .box2 { fill: #ffffff; stroke: #a16207; stroke-width: 2; }
      .h { font: 700 22px sans-serif; fill: #713f12; }
      .t { font: 16px sans-serif; fill: #713f12; }
      .s { font: 13px sans-serif; fill: #a16207; }
      .line { stroke: #a16207; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="520"/>
  <text class="h" x="40" y="45">거버넌스 &amp; 비용 가드레일</text>

  <rect class="box" x="40" y="80" width="920" height="360" rx="16"/>

  <rect class="box2" x="90" y="140" width="260" height="110" rx="12"/>
  <text class="t" x="115" y="180">태그(Tags)</text>
  <text class="s" x="115" y="205">비용센터, 환경, 담당자</text>

  <rect class="box2" x="370" y="140" width="260" height="110" rx="12"/>
  <text class="t" x="395" y="180">Budgets(예산)</text>
  <text class="s" x="395" y="205">놀라기 전에 알림</text>

  <rect class="box2" x="650" y="140" width="260" height="110" rx="12"/>
  <text class="t" x="675" y="180">계정(Accounts)</text>
  <text class="s" x="675" y="205">블라스트 반경 분리</text>

  <line class="line" x1="220" y1="250" x2="220" y2="360"/>
  <line class="line" x1="500" y1="250" x2="500" y2="360"/>
  <line class="line" x1="780" y1="250" x2="780" y2="360"/>

  <text class="t" x="120" y="395">가시성</text>
  <text class="t" x="435" y="395">조기 경고</text>
  <text class="t" x="710" y="395">정책 경계</text>
</svg>
