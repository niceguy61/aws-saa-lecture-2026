<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-label="비용 드라이버 지도: 컴퓨트, 스토리지, 네트워크, 가시성">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="380" rx="18"/>
  <text class="title" x="28" y="42">비용 최적화: 요구사항은 유지하고, 비용 드라이버를 제거한다(가시성부터)</text>

  <rect class="box" x="60" y="90" width="860" height="240" rx="14"/>
  <rect class="muted" x="90" y="125" width="240" height="170" rx="14"/>
  <text class="text" x="110" y="160">컴퓨트</text>
  <text class="small" x="110" y="186">시간, 요청 수,</text>
  <text class="small" x="110" y="206">구매 옵션,</text>
  <text class="small" x="110" y="226">라이트사이징, ASG</text>

  <rect class="muted" x="370" y="125" width="240" height="170" rx="14"/>
  <text class="text" x="390" y="160">스토리지</text>
  <text class="small" x="390" y="186">GB-월, 요청 수,</text>
  <text class="small" x="390" y="206">라이프사이클/티어,</text>
  <text class="small" x="390" y="226">백업/복구 비용</text>

  <rect class="muted" x="650" y="125" width="240" height="170" rx="14"/>
  <text class="text" x="670" y="160">네트워크</text>
  <text class="small" x="670" y="186">인터넷 egress, NAT,</text>
  <text class="small" x="670" y="206">AZ/리전 간 전송,</text>
  <text class="small" x="670" y="226">CDN/엔드포인트 선택</text>

  <rect class="box" x="60" y="336" width="860" height="28" rx="10"/>
  <text class="small" x="76" y="356">시험 감각: “팀/프로젝트 비용 분해” ⇒ 태그/계정 + Cost Explorer. “숨은 스파이크” ⇒ NAT/전송/요청 수.</text>
</svg>
