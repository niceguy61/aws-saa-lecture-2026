<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-label="Cost drivers map: compute, storage, network and visibility">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="380" rx="18"/>
  <text class="title" x="28" y="42">Cost optimization: keep requirements, remove cost drivers (visibility first)</text>

  <rect class="box" x="60" y="90" width="860" height="240" rx="14"/>
  <rect class="muted" x="90" y="125" width="240" height="170" rx="14"/>
  <text class="text" x="110" y="160">Compute</text>
  <text class="small" x="110" y="186">hours, requests,</text>
  <text class="small" x="110" y="206">purchase options,</text>
  <text class="small" x="110" y="226">right-sizing, ASG</text>

  <rect class="muted" x="370" y="125" width="240" height="170" rx="14"/>
  <text class="text" x="390" y="160">Storage</text>
  <text class="small" x="390" y="186">GB-month, requests,</text>
  <text class="small" x="390" y="206">lifecycle/tiers,</text>
  <text class="small" x="390" y="226">backup/restore cost</text>

  <rect class="muted" x="650" y="125" width="240" height="170" rx="14"/>
  <text class="text" x="670" y="160">Network</text>
  <text class="small" x="670" y="186">internet egress, NAT,</text>
  <text class="small" x="670" y="206">cross-AZ/region,</text>
  <text class="small" x="670" y="226">CDN/endpoint choices</text>

  <rect class="box" x="60" y="336" width="860" height="28" rx="10"/>
  <text class="small" x="76" y="356">Exam intuition: "team/project cost breakdown" => tags/accounts + Cost Explorer. "hidden spikes" => NAT/data transfer/requests.</text>
</svg>

