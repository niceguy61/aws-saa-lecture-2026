<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-label="RDS/Aurora: Multi-AZ(HA) vs Read Replica(읽기 확장)">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#m); }
      .dash { stroke-dasharray: 6 6; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="380" rx="18"/>
  <text class="title" x="28" y="42">RDS/Aurora: Multi-AZ는 HA failover, Read Replica는 읽기 확장</text>

  <rect class="box" x="60" y="90" width="860" height="240" rx="14"/>
  <text class="text" x="80" y="126">앱</text>

  <rect class="muted" x="210" y="110" width="180" height="70" rx="12"/>
  <text class="text" x="232" y="150">Primary(주)</text>
  <text class="small" x="232" y="170">쓰기</text>

  <rect class="muted" x="210" y="220" width="180" height="70" rx="12"/>
  <text class="text" x="232" y="260">Standby(대기)</text>
  <text class="small" x="232" y="280">Multi-AZ (HA)</text>

  <rect class="muted" x="560" y="110" width="180" height="70" rx="12"/>
  <text class="text" x="580" y="150">Read Replica</text>
  <text class="small" x="580" y="170">읽기 확장</text>

  <rect class="muted" x="760" y="110" width="140" height="70" rx="12"/>
  <text class="small" x="772" y="150">더 많은 Replica</text>

  <path class="arrow" d="M 130 126 L 210 145"/>
  <text class="small" x="128" y="156">쓰기</text>
  <path class="arrow" d="M 130 126 L 560 145"/>
  <text class="small" x="344" y="116">읽기</text>

  <path class="arrow" d="M 300 180 L 300 220"/>
  <text class="small" x="318" y="206">동기(sync)</text>

  <path class="arrow dash" d="M 390 145 L 560 145"/>
  <text class="small" x="416" y="168">비동기(async)</text>

  <path class="arrow" d="M 740 145 L 760 145"/>

  <rect class="muted" x="60" y="336" width="860" height="28" rx="10"/>
  <text class="small" x="76" y="356">시험 감각: “자동 failover/HA” ⇒ Multi-AZ. “읽기 위주 확장” ⇒ Read Replica. 대부분의 시험 패턴에서 Read Replica는 HA용 Standby가 아니다.</text>
</svg>
