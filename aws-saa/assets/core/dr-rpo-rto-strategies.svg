<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-label="DR 전략을 RPO/RTO로 고르는 메뉴">
  <defs>
    <style>
      .bg { fill: #fbfbf7; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .muted { fill: #f3f4f6; stroke: #1f2937; stroke-width: 2; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .text { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111827; }
      .axis { stroke: #111827; stroke-width: 2; }
      .grid { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="380" rx="18"/>
  <text class="title" x="28" y="42">DR 전략 메뉴: RPO(데이터 손실)와 RTO(복구 시간)로 고른다</text>

  <!-- chart area -->
  <rect class="box" x="60" y="80" width="600" height="250" rx="14"/>
  <line class="axis" x1="120" y1="300" x2="620" y2="300"/>
  <line class="axis" x1="120" y1="300" x2="120" y2="110"/>

  <text class="small" x="560" y="320">RTO 낮음(더 빠름)</text>
  <text class="small" x="78" y="118">RPO 낮음(손실 적음)</text>

  <line class="grid" x1="120" y1="240" x2="620" y2="240"/>
  <line class="grid" x1="120" y1="180" x2="620" y2="180"/>
  <line class="grid" x1="260" y1="110" x2="260" y2="300"/>
  <line class="grid" x1="400" y1="110" x2="400" y2="300"/>
  <line class="grid" x1="540" y1="110" x2="540" y2="300"/>

  <!-- strategy points -->
  <rect class="muted" x="150" y="255" width="170" height="40" rx="10"/>
  <text class="text" x="162" y="281">백업/복구</text>

  <rect class="muted" x="300" y="215" width="170" height="40" rx="10"/>
  <text class="text" x="318" y="241">파일럿 라이트</text>

  <rect class="muted" x="430" y="175" width="190" height="40" rx="10"/>
  <text class="text" x="442" y="201">웜 스탠바이</text>

  <rect class="muted" x="520" y="125" width="120" height="40" rx="10"/>
  <text class="text" x="530" y="151">액티브/액티브</text>

  <!-- note panel -->
  <rect class="box" x="700" y="90" width="250" height="240" rx="14"/>
  <text class="text" x="720" y="124">시험 감각</text>
  <text class="small" x="720" y="150">1) 요구사항에서 RPO/RTO를 뽑는다</text>
  <text class="small" x="720" y="172">2) 전략을 고른다</text>
  <text class="small" x="720" y="194">3) 그 다음 서비스를 고른다</text>
  <text class="small" x="720" y="220">Failover + 헬스체크</text>
  <text class="small" x="720" y="242">Route 53과 자주 세트</text>
</svg>
