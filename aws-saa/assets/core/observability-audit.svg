<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; }
      .box2 { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .h { font: 700 22px sans-serif; fill: #0f172a; }
      .t { font: 16px sans-serif; fill: #0f172a; }
      .s { font: 13px sans-serif; fill: #334155; }
      .line { stroke: #0f172a; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="520"/>
  <text class="h" x="40" y="45">Observability and Audit (Who did what vs What changed)</text>

  <rect class="box" x="40" y="80" width="920" height="360" rx="16"/>

  <rect class="box2" x="100" y="150" width="260" height="120" rx="12"/>
  <text class="t" x="125" y="190">CloudWatch</text>
  <text class="s" x="125" y="215">metrics, logs, alarms</text>

  <rect class="box2" x="380" y="150" width="260" height="120" rx="12"/>
  <text class="t" x="405" y="190">CloudTrail</text>
  <text class="s" x="405" y="215">API activity</text>

  <rect class="box2" x="660" y="150" width="260" height="120" rx="12"/>
  <text class="t" x="685" y="190">Config</text>
  <text class="s" x="685" y="215">resource state and compliance</text>

  <line class="line" x1="230" y1="270" x2="230" y2="360"/>
  <line class="line" x1="510" y1="270" x2="510" y2="360"/>
  <line class="line" x1="790" y1="270" x2="790" y2="360"/>

  <text class="t" x="170" y="395">Symptom and SLO</text>
  <text class="t" x="465" y="395">Who changed it</text>
  <text class="t" x="725" y="395">What is compliant</text>
</svg>

